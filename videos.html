<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch Ads</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🎥 Watch Ads</h1>

<p>Complete your daily tasks</p>


<div class="card">

<h2>Advertisement 1</h2>

<p>Reward: PKR 100</p>

<div style="background:#020617;height:150px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:45px;">
▶️
</div>

<button class="login" onclick="watchAd(1)">
Start Watching
</button>

<p id="status1">Not Started</p>

</div>



<div class="card">

<h2>Advertisement 2</h2>

<p>Reward: PKR 100</p>

<div style="background:#020617;height:150px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:45px;">
▶️
</div>

<button class="login" onclick="watchAd(2)">
Start Watching
</button>

<p id="status2">Not Started</p>

</div>



<div class="card">

<h2>Advertisement 3</h2>

<p>Reward: PKR 100</p>

<div style="background:#020617;height:150px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:45px;">
▶️
</div>

<button class="login" onclick="watchAd(3)">
Start Watching
</button>

<p id="status3">Not Started</p>

</div>



<div class="card balance-card">

<h3>Total Today's Earning</h3>

<h1 id="earning">
PKR 0
</h1>

</div>



<button class="register" onclick="location.href='dashboard.html'">
⬅ Back Dashboard
</button>


</div>



<script>

let total = 0;


function watchAd(id){

let time = 10;

let status = document.getElementById("status"+id);


let timer = setInterval(()=>{

status.innerHTML="Watching: "+time+"s";

time--;


if(time < 0){

clearInterval(timer);

status.innerHTML="✅ Completed";

total += 100;

document.getElementById("earning").innerHTML =
"PKR "+total;

}

},1000);

}

</script>


</body>
</html>
