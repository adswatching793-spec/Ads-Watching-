<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Watch Videos - Ads Watching</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>🎥 Watch Ads</h1>

<p>Complete videos and track your tasks</p>



<div class="card">

<h2>Advertisement 1</h2>

<p>Watch this ad for 30 seconds</p>


<div style="background:#020617;height:180px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:50px;">
▶️
</div>


<h3 id="timer" style="margin-top:20px;">
Ready
</h3>


<button class="login" onclick="startWatch()">
Start Watching
</button>


</div>




<div class="card">

<h3>
Today's Earning
</h3>

<h1 id="earning">
PKR 0
</h1>


</div>



<button class="register" onclick="location.href='dashboard.html'">
⬅ Back Dashboard
</button>



</div>



<script>

let seconds = 30;
let earning = 0;


function startWatch(){

let timer = setInterval(function(){

document.getElementById("timer").innerHTML =
"Time Left: " + seconds + "s";


seconds--;


if(seconds < 0){

clearInterval(timer);

earning = 100;


document.getElementById("earning").innerHTML =
"PKR " + earning;


document.getElementById("timer").innerHTML =
"✅ Completed";

}

},1000);

}

</script>


</body>

</html>
