<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Ads Watching</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Create Account</h1>

<input id="name" type="text" placeholder="Full Name" style="width:100%;padding:15px;margin:10px 0;border:none;border-radius:10px;">

<input id="email" type="email" placeholder="Email Address" style="width:100%;padding:15px;margin:10px 0;border:none;border-radius:10px;">

<input id="password" type="password" placeholder="Create Password" style="width:100%;padding:15px;margin:10px 0;border:none;border-radius:10px;">

<button id="registerBtn" class="register">Create Account</button>

<p id="msg" style="color:white;margin-top:15px;"></p>

<p style="margin-top:20px;color:white;">
Already have an account?
</p>

<a href="login.html" style="color:#2563eb;text-decoration:none;">
Login Here
</a>

<script type="module" src="register.js"></script>

</div>

</body>
</html>
