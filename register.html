<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register - Ads Watching</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <div class="profile-box">

        <h1>🚀 Create Account</h1>

        <p>Join Ads Watching Community</p>

    </div>



    <div class="card">


        <input id="name"
        type="text"
        placeholder="Full Name">


        <input id="email"
        type="email"
        placeholder="Email Address">


        <input id="password"
        type="password"
        placeholder="Create Password">


        <button id="registerBtn" class="register">
            Create Account
        </button>


        <p id="msg" style="color:white;margin-top:15px;"></p>


    </div>



    <p>
        Already have an account?
    </p>


    <a href="login.html"
    style="color:#38bdf8;text-decoration:none;font-weight:bold;">
        Login Here
    </a>



<script type="module" src="register.js"></script>


</div>


</body>
</html>
