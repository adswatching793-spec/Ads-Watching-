<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Ads Watching</title>
<link rel="stylesheet" href="style.css">
</head><body><div class="container"><div class="profile-box">
    <img src="https://ui-avatars.com/api/?name=User&background=22c55e&color=fff&size=120"
    class="profile-img">

    <h2>Welcome User 👋</h2>
    <p>Ads Watching Member</p>
</div>


<div class="card balance-card">
    <p>Current Balance</p>
    <h1 id="balance">PKR 2000</h1>
    <span>🎁 Welcome Bonus Added</span>
</div>


<div class="card">
    <h3>Quick Actions</h3>

    <button class="login" onclick="location.href='videos.html'">
        🎥 Watch Videos
    </button>

    <button class="register" onclick="location.href='deposit.html'">
        💳 Deposit
    </button>

    <button style="background:#ef4444;color:white;"
    onclick="location.href='withdraw.html'">
        💸 Withdraw
    </button> 

    <button style="background:#0ea5e9;color:white;"
    onclick="location.href='profile.html'">
        👤 Profile
    </button>
<button style="background:#f97316;color:white;"
onclick="logout()">
🚪 Logout
</button>
</div>

</div><script src="dashboard.js"></script></body>
</html>
