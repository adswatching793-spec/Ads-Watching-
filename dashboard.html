<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Ads Watching</title>

<link rel="stylesheet" href="style.css">


<style>

.gift-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}


.gift{
font-size:120px;
cursor:pointer;
animation:shake 1s infinite;
}


.gift-text{
color:white;
font-size:22px;
margin-top:20px;
}


.open-animation{
animation:openGift 1s forwards;
}


.bonus{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#1e293b;
padding:35px;
border-radius:20px;
color:white;
text-align:center;
z-index:1000;
box-shadow:0 0 30px black;
}


@keyframes shake{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-20px);
}

}


@keyframes openGift{

50%{
transform:scale(1.5) rotate(20deg);
}

100%{
transform:scale(0);
}

}


</style>

</head>


<body>


<div class="gift-screen" id="giftScreen">

<div class="gift" onclick="openGift()">
🎁
</div>

<div class="gift-text">
Tap To Open Your Gift
</div>

</div>



<div class="bonus" id="bonus">

<h1>🎉 Congratulations!</h1>

<h2>Welcome Bonus</h2>

<h1>PKR 2000</h1>

</div>





<div class="container">


<div class="profile-box">


<img src="https://ui-avatars.com/api/?name=User&background=22c55e&color=fff&size=120"
class="profile-img">


<h2 id="userName">
Welcome User 👋
</h2>


<p>
Ads Watching Member
</p>


</div>





<div class="card balance-card">

<p>
Current Balance
</p>


<h1 id="balance">
PKR 0
</h1>


<span>
🎁 Welcome Bonus
</span>


</div>





<div class="card">


<h3>
Quick Actions
</h3>



<button class="login" onclick="location.href='videos.html'">
🎥 Watch Videos
</button>


<button class="register" onclick="location.href='deposit.html'">
💳 Deposit
</button>


<button style="background:#ef4444;color:white;"
onclick="location.href='withdraw.html'">
💸 Withdraw
</button>


<button style="background:#0ea5e9;color:white;"
onclick="location.href='profile.html'">
👤 Profile
</button>


<button style="background:#f97316;color:white;"
onclick="logout()">
🚪 Logout
</button>


</div>


</div>





<script>


function openGift(){

let gift=document.querySelector(".gift");

gift.classList.add("open-animation");


setTimeout(()=>{

document.getElementById("giftScreen").style.display="none";

document.getElementById("bonus").style.display="none";

document.getElementById("balance").innerHTML="PKR 2000";

localStorage.setItem("giftOpened","yes");

},1000);


}


</script>



<script src="dashboard.js"></script>


</body>

</html>
