<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard - Ads Watching</title>

<link rel="stylesheet" href="style.css">


<style>

.gift-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}


.gift{
cursor:pointer;
text-align:center;
animation:float 2s infinite;
}


.box-body{
width:130px;
height:110px;
background:linear-gradient(45deg,#f59e0b,#f97316);
border-radius:12px;
font-size:60px;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 15px 30px rgba(0,0,0,.5);
}


.box-top{
width:145px;
height:25px;
background:#ef4444;
border-radius:10px;
margin:auto;
position:relative;
top:10px;
}


.gift.open-animation .box-body{
animation:giftOpen 1s forwards;
}


@keyframes float{

50%{
transform:translateY(-15px);
}

}


@keyframes giftOpen{

50%{
transform:scale(1.4) rotate(10deg);
}

100%{
transform:scale(0);
opacity:0;
}

}


.gift-text{
color:white;
font-size:22px;
margin-top:20px;
}


.open-animation{
animation:openGift 1s forwards;
}


.bonus{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#1e293b;
padding:35px;
border-radius:20px;
color:white;
text-align:center;
z-index:1000;
box-shadow:0 0 30px black;
}


@keyframes shake{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-20px);
}

}


@keyframes openGift{

50%{
transform:scale(1.5) rotate(20deg);
}

100%{
transform:scale(0);
}

}

.confetti{
position:fixed;
top:-20px;
font-size:25px;
animation:fall 2s linear forwards;
z-index:2000;
}


@keyframes fall{

0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(700px) rotate(360deg);
opacity:0;
}

  }
  .reward-card{
width:300px;
padding:35px 25px;
background:linear-gradient(145deg,#1e293b,#0f172a);
border-radius:25px;
text-align:center;
color:white;
cursor:pointer;
box-shadow:0 20px 50px rgba(0,0,0,.5);
animation:rewardShow 1s ease;
}


.gift-icon{
font-size:70px;
margin-bottom:15px;
animation:giftFloat 2s infinite;
}


.reward-card h2{
font-size:28px;
margin:10px 0;
}


.reward-card p{
color:#cbd5e1;
}


.reward-card button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:#22c55e;
color:white;
font-size:16px;
cursor:pointer;
}


@keyframes rewardShow{

from{
transform:scale(.7);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}


@keyframes giftFloat{

50%{
transform:translateY(-10px);
}

}
  .open-animation{
animation: giftOpen 1s ease forwards;
}

@keyframes giftOpen{

0%{
transform:scale(1);
opacity:1;
}

50%{
transform:scale(1.15) rotate(5deg);
}

100%{
transform:scale(0);
opacity:0;
}

}
</style>

</head>


<body>


<div class="gift-screen" id="giftScreen">

<div class="reward-card" onclick="openGift();">

<div class="gift-icon">
🎁
</div>

<div class="reward-card" id="giftScreen">

<div class="gift-box" onclick="openGift()">

<div class="gift-icon">
🎁
</div>

<h2>Welcome Reward</h2>

<p>Tap to open your reward</p>

</div>

</div>

<div class="gift-text">
Tap To Open Your Gift
</div>

</div>



<div class="bonus" id="bonus">

<h1>🎉 Congratulations!</h1>

<h2>Welcome Bonus</h2>

<h1>PKR 2000</h1>

</div>





<div class="container">


<div class="profile-box">


<img src="https://ui-avatars.com/api/?name=User&background=22c55e&color=fff&size=120"
class="profile-img">


<h2 id="userName">
Welcome User 👋
</h2>


<p>
Ads Watching Member
</p>


</div>





<div class="card balance-card">

<p>
Current Balance
</p>


<h1 id="balance">
PKR 0
</h1>


<span>
🎁 Welcome Bonus
</span>


</div>





<div class="card">


<h3>
Quick Actions
</h3>



<button class="login" onclick="location.href='videos.html'">
🎥 Watch Videos
</button>


<button class="register" onclick="location.href='deposit.html'">
💳 Deposit
</button>


<button style="background:#ef4444;color:white;"
onclick="location.href='withdraw.html'">
💸 Withdraw
</button>


<button style="background:#0ea5e9;color:white;"
onclick="location.href='profile.html'">
👤 Profile
</button>


<button style="background:#f97316;color:white;"
onclick="logout()">
🚪 Logout
</button>


</div>


</div>





<script>


function openGift(){

document.getElementById("giftScreen").style.display="none";

localStorage.setItem("giftOpened","yes");

document.getElementById("balance").innerHTML="PKR 2000";

}
document.getElementById("balance").innerHTML="PKR 2000";

  }
let gift=document.querySelector(".gift");

gift.classList.add("open-animation");


if(localStorage.getItem("giftOpened") === "yes"){

document.getElementById("giftScreen").style.display="none";

document.getElementById("balance").innerHTML="PKR 2000";

}


}


</script>



<script src="dashboard.js"></script>


</body>

</html>
